<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171a21" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Cobaye : testez vos habitudes comme un scientifique. Essais A/B randomisés sur vous-même, résultats scellés, verdict honnête. Gratuit, hors-ligne, sans compte." />
    <meta property="og:title" content="Cobaye — testez vos habitudes comme un scientifique" />
    <meta property="og:description" content="Essais A/B randomisés sur un seul sujet : vous. Gratuit, hors-ligne, sans compte." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Cobaye</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('cobaye.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
